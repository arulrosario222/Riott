<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SheetMart – Excel Templates</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#64707d;--bd:#e3e6ea;--pr:#107c41;--ac:#e8f5ec;--dn:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2226;--tx:#eceff1;--mut:#9aa6b2;--bd:#2d353b;--ac:#173323}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:19px;color:var(--pr);margin-right:auto;cursor:pointer}
nav a,.lnk{color:var(--tx);text-decoration:none;cursor:pointer;padding:4px 2px;font-size:14px}nav a:hover,.lnk:hover{color:var(--pr)}
main{max-width:1100px;margin:auto;padding:16px}
.hero{background:linear-gradient(120deg,var(--pr),#1fa35c);color:#fff;border-radius:14px;padding:30px 24px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.92}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:70px}.tools input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .im{height:130px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:46px}
.card .im img{width:100%;height:100%;object-fit:cover}.card .bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:12px;color:var(--mut)}.pr b{font-size:18px}.pr s{color:var(--mut);margin:0 6px;font-size:13px}.pr span{color:var(--pr);font-size:13px;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.d{color:var(--dn)}button.sm{padding:3px 8px;font-size:13px}
.row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.form{display:grid;gap:10px;max-width:460px}.form.w{max-width:none;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{font-size:13px;color:var(--mut);display:grid;gap:3px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mut);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.stat b{font-size:22px;display:block}.stat span{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--ac);color:var(--pr)}.tag.g{background:var(--bd);color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:60;max-width:90%}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal>div{background:var(--card);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.note{font-size:12px;color:var(--mut)}footer{text-align:center;color:var(--mut);font-size:13px;padding:24px 16px}
.hero2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;background:linear-gradient(135deg,#0b5c30,#17a05a 60%,#5fd08f);color:#fff;border-radius:20px;padding:40px 32px;margin-bottom:16px;overflow:hidden}
.hero2 h1{font-size:clamp(26px,4.5vw,42px);line-height:1.15;margin:12px 0 10px}.hero2 p{font-size:17px;opacity:.92;margin:0}
.badge{background:#fff3;border-radius:99px;padding:4px 12px;font-size:13px}.big{padding:11px 20px;font-weight:600}.ghost{background:transparent;color:#fff;border-color:#fff8}.hero2 .p{background:#fff;color:#0b5c30;border-color:#fff}
.hv{position:relative;min-height:220px;display:flex;align-items:center;justify-content:center}.hv img{max-width:100%;max-height:300px;border-radius:14px}
.fl{position:absolute;font-size:48px;background:#fff2;border-radius:18px;padding:14px}.fl.a{top:5%;left:12%;font-size:64px}.fl.b{top:10%;right:8%}.fl.c{bottom:6%;left:6%}.fl.d{bottom:10%;right:18%;font-size:56px}
.stripe{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stripe div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}.stripe b{display:block;font-size:22px;color:var(--pr)}.stripe span{color:var(--mut);font-size:13px}
.sec{margin:32px 0 14px;font-size:22px}.cats,.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.feats .box{margin:0}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:.15s}.cc:hover{border-color:var(--pr);transform:translateY(-3px)}.cc span{color:var(--mut);font-size:13px}.cc small{color:var(--pr)}
.ci{font-size:34px}.about{margin-top:32px;background:var(--ac);border-radius:18px;padding:34px 24px;text-align:center}.about h2{margin:0 0 8px}.about p{max-width:560px;margin:0 auto 16px;color:var(--mut)}
@media(max-width:700px){.hero2{grid-template-columns:1fr;padding:28px 20px}.hv{min-height:150px}}
.logo{display:flex;align-items:center;gap:8px}
.auth{display:grid;grid-template-columns:1.1fr .9fr;border-radius:20px;overflow:hidden;border:1px solid var(--bd);background:var(--card);min-height:560px}
.aside{background:linear-gradient(150deg,#0b5c30,#17a05a 65%,#5fd08f);color:#fff;padding:32px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.aside h2{font-size:26px;line-height:1.2;margin:14px 0 0}.aside p{margin:0;opacity:.9}.alogo{display:flex;align-items:center;gap:10px;font-size:20px}
.aside ul{list-style:none;padding:0;margin:auto 0 0;display:grid;gap:6px;font-size:14px;position:relative;z-index:2}
.collage{position:relative;height:210px;margin:18px 0}.collage img{position:absolute;width:62%;border-radius:12px;box-shadow:0 10px 30px #0004;border:3px solid #fff}
.collage .c0{left:0;top:10px;transform:rotate(-6deg)}.collage .c1{right:0;top:0;transform:rotate(5deg)}.collage .c2{left:20%;top:70px;transform:rotate(-2deg)}
.fcard{padding:36px 32px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px}.auth .fcard{border:0;border-radius:0}.fcard .form{max-width:none}
.flogo{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.flogo h2{margin:6px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px}.seg button{border:0;background:transparent}.seg button.on{background:var(--pr);color:#fff}
@media(max-width:760px){.auth{grid-template-columns:1fr}.collage{height:170px}}
.upb{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:600;font-size:14px}.upb:hover{border-color:var(--pr)}
.af{position:fixed;inset:0;display:flex;background:#0b3d22;overflow:auto;z-index:30}
.show{flex:1.25;position:relative;overflow:hidden;background:linear-gradient(135deg,#0b5c30,#17a05a 60%,#5fd08f);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100%}
.show .brand{position:absolute;top:22px;left:28px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;z-index:3;cursor:pointer}
.bub{position:absolute;border-radius:50%;background:#fff1;animation:fl 9s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.stage{position:relative;width:min(520px,80%);height:min(440px,70vh)}
.sl{position:absolute;inset:0;opacity:0;transform:translateX(90px) rotate(3deg) scale(.9);transition:opacity .7s,transform .7s;display:flex;flex-direction:column;gap:10px}
.sl.on{opacity:1;transform:none}.sl.out{opacity:0;transform:translateX(-90px) rotate(-3deg) scale(.9)}
.win{background:var(--card);color:var(--tx);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px #0005}
.win .dts{height:26px;background:var(--bd);display:flex;align-items:center;gap:6px;padding:0 10px}.win .dts i{width:9px;height:9px;border-radius:50%;background:#e74c3c}.win .dts i:nth-child(2){background:#f1c40f}.win .dts i:nth-child(3){background:#2ecc71}
.win img{display:block;width:100%;height:260px;object-fit:cover}.sl.on .win img{animation:kb 6s ease-out forwards}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.cap{background:#0003;border-radius:12px;padding:12px 14px}.cap b{font-size:19px}.cap div{font-size:13px;opacity:.9}
.dotsnav{position:absolute;bottom:26px;display:flex;gap:8px}.dotsnav i{width:8px;height:8px;border-radius:50%;background:#fff6;transition:.3s}.dotsnav i.on{width:26px;border-radius:6px;background:#fff}
.side{flex:.75;min-width:380px;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--card);border-radius:40px 0 0 40px;margin-left:-40px;position:relative;z-index:4;box-shadow:-10px 0 40px #0003}
.dlg{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}.dlg .form{max-width:none}
@media(max-width:820px){.af{flex-direction:column}.show{flex:none;height:150px}.stage,.dotsnav{display:none}.side{border-radius:30px 30px 0 0;margin:-30px 0 0;min-width:0;flex:1}.show .brand{position:static}}
.side{overflow:hidden}.dlg{position:relative;z-index:2;padding:28px 26px;border-radius:26px;background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);box-shadow:0 18px 50px #0b5c3022}
.fx{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 90% -10%,#c9f1d9 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#d6e8ff 0,transparent 55%)}
@media(prefers-color-scheme:dark){.fx{background:radial-gradient(900px 520px at 90% -10%,#10402a 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#12314d 0,transparent 55%)}}
.fx .o{position:absolute;display:block}
.o1{width:190px;height:190px;border-radius:50%;background:linear-gradient(135deg,#17a05a,#8eeab5);opacity:.38;top:5%;right:-50px;animation:drift 14s ease-in-out infinite}
.o2{width:120px;height:120px;border-radius:34px;background:linear-gradient(135deg,#f6d365,#fda085);opacity:.4;bottom:9%;left:7%;animation:spin 26s linear infinite}
.o3{width:96px;height:96px;border-radius:50%;border:11px solid #17a05a40;top:44%;left:-34px;animation:drift 11s ease-in-out infinite reverse}
.o4{width:140px;top:12%;left:8%;animation:bob 9s ease-in-out infinite}.o5{width:150px;bottom:7%;right:7%;animation:bob 11s ease-in-out infinite reverse}
.o6{width:58px;height:58px;border-radius:50%;bottom:34%;right:6%;display:flex!important;align-items:center;justify-content:center;font:700 26px/1 Arial;color:#8a5a00;background:radial-gradient(circle at 30% 30%,#fff3b0,#f2b84b);box-shadow:0 8px 24px #f2b84b66;animation:bob 8s ease-in-out infinite}
.o7{width:10px;height:10px;border-radius:50%;background:#17a05a;top:26%;right:22%;box-shadow:60px 90px 0 #f2b84b,-120px 150px 0 #5fd08f,-40px 300px 0 #17a05a;opacity:.6;animation:drift 7s ease-in-out infinite}
.fx svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 22px #0b5c3030)}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,32px)}}
@keyframes spin{from{transform:rotate(15deg)}to{transform:rotate(375deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-24px) rotate(3deg)}}
.modal>div{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.fx .o,.bub{animation:none}}

/* splash / loading screen */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b5c30,#17a05a 60%,#5fd08f);color:#fff;transition:opacity .45s,visibility .45s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
#splash .spb{position:absolute;border-radius:50%;background:#fff1;animation:fl 9s ease-in-out infinite}
.spi{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.splogo{width:92px;height:92px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px #0004;animation:sppulse 1.8s ease-in-out infinite}
.splogo img,.splogo svg{width:60px;height:60px;object-fit:contain;border-radius:10px}
.spname{font-size:28px;font-weight:700;letter-spacing:.3px}
.spbar{width:180px;height:5px;border-radius:99px;background:#fff3;overflow:hidden}
.spbar i{display:block;height:100%;width:40%;border-radius:99px;background:#fff;animation:spslide 1.2s ease-in-out infinite}
.spmsg{font-size:14px;opacity:.9;min-height:20px}
@keyframes sppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spslide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media(prefers-reduced-motion:reduce){.splogo,.spbar i,#splash .spb{animation:none}}
/* coming-soon popup */
.modal>.soonc{max-width:380px;text-align:center;padding:30px 24px;background:linear-gradient(160deg,var(--card) 55%,var(--ac))}
.soonc .se{font-size:58px;line-height:1;display:inline-block;animation:bob 3s ease-in-out infinite}
.soonc h3{margin:12px 0 6px;font-size:22px;color:var(--pr)}
.soonc p{margin:0 0 18px;color:var(--mut);font-size:15px}
.soonc .chip{display:inline-block;background:var(--ac);color:var(--pr);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;letter-spacing:.5px;margin-bottom:6px}
/* product details page */
.card .im{position:relative}.vtag{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:12px;padding:2px 9px;border-radius:99px}
.pp{max-width:860px;margin:0 auto}.back{display:inline-block;margin:2px 0 12px;color:var(--pr);cursor:pointer;font-size:14px}
.vbox{position:relative;aspect-ratio:16/9;background:var(--ac);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:90px;border:1px solid var(--bd)}
.vbox>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vbox video,.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vscrim{position:absolute;inset:0;background:linear-gradient(#0000,#0006)}
.playb{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:#ffffffee;color:var(--pr);font-size:30px;padding:0 0 0 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px #0006;animation:sppulse 2s ease-in-out infinite}
.playl{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px #0008}
.ptitle{margin:16px 0 4px;font-size:26px}.ft{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ft li{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.ft li:before{content:'✓';color:var(--pr);font-weight:700}
.pbuy{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}

/* AI Prompts full-screen page */
.aip{position:fixed;inset:0;z-index:70;background:#8f9cfa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;animation:aifade .4s ease-out}
@keyframes aifade{from{opacity:0}to{opacity:1}}
.aip .aix{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#ffffffd9;color:#2b2f6b;font-size:20px;padding:0;box-shadow:0 6px 18px #0003}
.aip .aif{position:relative;width:min(1180px,100%,calc((100vh - 190px)*16/9));min-width:min(100%,300px);aspect-ratio:16/9;border-radius:40px 40px 50% 50%/40px 40px 14% 14%;overflow:hidden;background:#8f9cfa;box-shadow:0 30px 70px #2b2f6b55;flex:none}
.aip .aif img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:aikb 14s ease-in-out infinite alternate}
@keyframes aikb{from{transform:scale(1)}to{transform:scale(1.045)}}
.aip .sp{position:absolute;color:#fff;font-size:22px;opacity:.85;animation:bob 5s ease-in-out infinite;pointer-events:none}
.aip .aid{position:relative;z-index:2;width:min(540px,94%);margin-top:calc(-1*min(64px,7vw));background:var(--card);color:var(--tx);border-radius:28px;padding:22px 24px 20px;text-align:center;box-shadow:0 24px 60px #2b2f6b66;border:1px solid var(--bd);animation:pop .5s .15s both ease-out}
.aip .aid h3{margin:6px 0 6px;font-size:clamp(20px,3.4vw,26px);color:var(--pr)}
.aip .aid p{margin:0 0 16px;color:var(--mut);font-size:clamp(14px,2.4vw,16px)}
.aip .aid .chip{display:inline-block;background:var(--ac);color:var(--pr);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;letter-spacing:.6px}
@media(prefers-reduced-motion:reduce){.aip .aif img,.aip .sp{animation:none}}

/* checkout windows: always dark premium */
.ck{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(900px 600px at 85% -10%,#12583a99,transparent 60%),#04070acc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:aifade .3s ease-out;color:#e9f1ed;overflow:auto}
.ckp,.ckc{background:linear-gradient(160deg,#11181d,#0a0e11);border:1px solid #23312a;border-radius:26px;box-shadow:0 40px 100px #000b;animation:ckin .5s cubic-bezier(.2,.9,.3,1.15) both;position:relative}
.ckp{width:min(960px,100%);max-height:calc(100vh - 28px);overflow:auto;display:grid;grid-template-columns:.85fr 1.15fr}
.ckc{width:min(480px,100%);padding:30px 26px;text-align:center}
@keyframes ckin{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.ckL{padding:30px 28px;background:linear-gradient(160deg,#0f3d2a,#0b2a1e 60%,#0a1f17);border-radius:26px 0 0 26px;display:flex;flex-direction:column;gap:14px}
.ckR{padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.ck h2,.ck h3,.ckf h1{margin:0;color:#fff}.ck p{color:#b9cbc1}
.ckbrand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#fff}
.ckamt{font-size:clamp(34px,6vw,46px);font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#8ef0b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ckrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed #ffffff1f;text-align:left}.ckrow span{color:#9db3a8}.ckrow b{text-align:right;word-break:break-all;color:#fff}
.cki{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:12px 14px;color:#e9f1ed}
.ckopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ckopt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#151e24;border:1px solid #26343c;color:#eaf2ee;font-weight:600;text-align:left;cursor:pointer;transition:.18s}
.ckopt:hover{border-color:#2ecc71;background:#18262b;transform:translateY(-2px);box-shadow:0 10px 24px #0007}
.ckopt i{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff;flex:none}
.ckopt.w{grid-column:1/-1}

const rd=f=>new Promise(r=>{if(!f)return r(null);const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
function route(){const h=location.hash.slice(1)||'shop';h=='admin'?admin():shopView(h)}
window.onhashchange=route;const isAdminPage=()=>location.pathname.replace(/\/+$/,'')=='/admin';
const go=h=>{if(isAdminPage()){location.href='/#'+h;return}location.hash=h;route()};

/* ---------- CUSTOMER SITE ---------- */
function head(){const n=S.cart.length,u=me();return `<header><div class="bar"><div class="logo" onclick="go('shop')">${logo(28)} ${esc(S.set.name)}</div><nav style="display:flex;gap:14px;flex-wrap:wrap"><a onclick="go('shop')">Shop</a><a onclick="soon('ai')">✨ AI Prompts</a><a onclick="soon('prod')">🆕 Products</a><a onclick="go('orders')">My Orders</a><a onclick="go('contact')">Contact</a><a id="cartlnk" onclick="go('cart')">🛒 Cart (${n})</a>${u?`<a onclick="logout()">Logout (${esc(u.name.split(' ')[0])})</a>`:`<a onclick="go('login')">Login / Register</a>`}</nav></div></header>`}
function foot(){return `<footer>© ${new Date().getFullYear()} ${esc(S.set.name)} · ${esc(S.set.email)} · ${esc(S.set.phone)}<br>${esc(S.set.addr)}</footer>`}
function shopView(v){clearInterval(atm);let b='';
if(v=='shop'){b=homeTop()+`<h2 class="sec" id="catalog">Browse all templates</h2>
<div class="tools"><input id="qs" placeholder="Search templates…" value="${esc(q)}" oninput="q=this.value;grid()"><select onchange="cf=this.value;grid()"><option value="">All categories</option>${S.cats.map(c=>`<option ${c==cf?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="grid" id="grid"></div>`+homeBottom()}
else if(v.startsWith('product-'))b=productView(+v.slice(8));else if(v=='cart')b=cartView();
else if(v=='login'){authPage();return}else if(v=='loginold')b=`<div class="box"><h2 style="margin-top:0">Login</h2><div class="form"><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="p" onclick="login()">Login</button></div></div>
<div class="box"><h2 style="margin-top:0">Create account</h2><div class="form"><input id="rn" placeholder="Full name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (min 6)"><button class="p" onclick="reg()">Register</button></div></div>`;
else if(v=='orders')b=ordersView();
else if(v=='contact')b=`<div class="box"><h2 style="margin-top:0">Contact support</h2><p>📧 ${esc(S.set.email)}<br>📞 ${esc(S.set.phone)}<br>📍 ${esc(S.set.addr)}</p><div class="form"><input id="cn" placeholder="Your name"><input id="ce" placeholder="Email"><textarea id="cm" placeholder="How can we help?"></textarea><button class="p" onclick="sendMsg()">Send message</button></div></div>`;
$('app').innerHTML=head()+`<main>${b}</main>`+foot();if(v=='shop')grid();scrollTo(0,0)}
const scr=id=>{const e=$(id);e&&e.scrollIntoView({behavior:'smooth'})};
function pickCat(c){cf=c;q='';shopView('shop');setTimeout(()=>scr('catalog'),50)}
const pcard=p=>`<div class="card"><div class="im">${p.img?`<img src="${p.img}" alt="">`:p.icon||'📄'}${hasVid(p)?'<span class="vtag">▶ Video</span>':''}</div><div class="bd"><div class="cat">${esc(p.cat)}</div><b>${esc(p.name)}</b><div class="pr"><b>${inr(fin(p))}</b>${p.disc?`<s>${inr(p.price)}</s><span>${p.disc}% off</span>`:''}</div><div class="row"><button class="sm" onclick="go('product-${p.id}')">Details</button><button class="p sm" onclick="add(${p.id})">Add to cart</button></div></div></div>`;
function homeTop(){const h=S.home,s=S.set,pub=S.products.filter(p=>p.pub);let fe=pub.filter(p=>p.feat);if(!fe.length)fe=pub.slice(0,3);
return `<section class="hero2"><div><span class="badge">${esc(h.badge)}</span><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p><div class="row" style="margin-top:18px"><button class="p big" onclick="scr('catalog')">${esc(h.btn)}</button><button class="big ghost" onclick="scr('reviews')">${esc(h.btn2)}</button></div></div><div class="hv">${h.heroImg?`<img src="${h.heroImg}" alt="">`:'<div class="fl a">📊</div><div class="fl b">🧾</div><div class="fl c">📦</div><div class="fl d">💼</div>'}</div></section>
<div class="stripe">${h.stats.map(x=>`<div><b>${esc(x.n)}</b><span>${esc(x.l)}</span></div>`).join('')}</div>
<h2 class="sec">Shop by category</h2><div class="cats">${S.cats.map(c=>{const x=S.catx[c]||{};return `<div class="cc" data-c="${esc(c)}" onclick="pickCat(this.dataset.c)"><div class="ci">${esc(x.i||'📁')}</div><b>${esc(c)}</b><span>${esc(x.d||'')}</span><small>${pub.filter(p=>p.cat==c).length} templates</small></div>`}).join('')}</div>
<h2 class="sec">Featured templates</h2><div class="grid">${fe.map(pcard).join('')}</div>`}
function homeBottom(){const h=S.home,s=S.set;return `<h2 class="sec">Why choose ${esc(s.name)}</h2><div class="feats">${h.feats.map(f=>`<div class="box"><div class="ci">${esc(f.i)}</div><b>${esc(f.t)}</b><p class="note" style="font-size:14px">${esc(f.d)}</p></div>`).join('')}</div>
<h2 class="sec" id="reviews">What customers say</h2><div class="feats">${h.reviews.map(r=>`<div class="box"><div style="color:#f5a623">${'★'.repeat(r.stars)+'☆'.repeat(5-r.stars)}</div><p>“${esc(r.text)}”</p><b>${esc(r.name)}</b><div class="note">${esc(r.role)}</div></div>`).join('')}</div>
<section class="about"><h2>${esc(h.aboutT)}</h2><p>${esc(h.aboutD)}</p><button class="p big" onclick="scr('catalog')">${esc(h.btn)}</button></section>`}
let lt='in';
const logo=sz=>S.set.logo?`<img src="${S.set.logo}" alt="" style="height:${sz}px;width:${sz}px;object-fit:contain;border-radius:10px">`:`<svg width="${sz}" height="${sz}" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#107c41"/><path d="M12 14h24v20H12zM12 21h24M12 28h24M22 14v20" stroke="#fff" stroke-width="2.5" fill="none"/></svg>`;
function loginView(){const imgs=S.products.filter(p=>p.img&&p.pub).slice(0,3);
return `<section class="auth"><div class="aside"><div class="alogo">${logo(44)}<b>${esc(S.set.name)}</b></div><h2>Work smarter with ready-made Excel templates</h2><p>${esc(S.set.sub)}</p><div class="collage">${imgs.map((p,i)=>`<img class="c${i}" src="${p.img}" alt="">`).join('')}</div><ul><li>⚡ Instant download after payment</li><li>🛠️ Fully editable formulas</li><li>🧾 All your purchases in one place</li></ul></div>
<div class="fcard"><div class="flogo">${logo(64)}<h2>${esc(S.set.name)}</h2><span class="note">${lt=='in'?'Welcome back! Log in to continue':'Create your free account'}</span></div>
<div class="seg"><button class="${lt=='in'?'on':''}" onclick="lt='in';shopView('login')">Login</button><button class="${lt=='up'?'on':''}" onclick="lt='up';shopView('login')">Register</button></div>
${lt=='in'?`<div class="form"><input id="le" placeholder="Email" autocomplete="email"><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><button class="p big" onclick="login()">Login</button><span class="note">New here? Tap Register above, it takes 10 seconds.</span></div>`:`<div class="form"><input id="rn" placeholder="Full name"><input id="re" placeholder="Email" autocomplete="email"><input id="rp" type="password" placeholder="Password (min 6)" onkeydown="if(event.key=='Enter')reg()"><button class="p big" onclick="reg()">Create account</button></div>`}</div></section>`}
function upiManual(total){if(!me()){toast('Please log in to continue');return go('login')}
const qs=`pa=${encodeURIComponent(S.set.upi)}&pn=${encodeURIComponent(S.set.upiName||S.set.name)}&am=${total}.00&cu=INR&tn=${encodeURIComponent(S.set.name+' order')}`;
const apps=[['GPay','tez://upi/pay?'],['PhonePe','phonepe://pay?'],['Paytm','paytmmp://pay?'],['BHIM / other UPI app','upi://pay?']];
$('mod').innerHTML=`<div class="modal"><div><h3 style="margin-top:0">Pay ${inr(total)} with UPI</h3><p class="note">Paying to <b>${esc(S.set.upiName||S.set.name)}</b> · ${esc(S.set.upi)} <button class="sm" onclick="try{navigator.clipboard.writeText(S.set.upi);toast('UPI ID copied')}catch(e){}">Copy</button></p>
<div class="cats" style="grid-template-columns:1fr 1fr;gap:8px">${apps.map(a=>`<a class="upb" href="${a[1]+qs}">${a[0]}</a>`).join('')}</div>
<p class="note" style="text-align:center;margin:12px 0 4px">On a computer? Scan with any UPI app</p><div id="qr" style="display:flex;justify-content:center"></div>
<label style="margin-top:12px">After paying, enter the UPI transaction / UTR number (12 digits)<input id="utr" inputmode="numeric" maxlength="12" placeholder="e.g. 412345678901"></label>
<div class="row" style="margin-top:12px"><button class="p" onclick="placeOrder(${total})">I’ve paid – submit</button><button onclick="$('mod').innerHTML=''">Cancel</button></div><p class="note">Downloads unlock after we confirm your payment.</p></div></div>`;
if(window.QRCode)new QRCode($('qr'),{text:'upi://pay?'+qs,width:150,height:150})}
function placeOrder(total){const u=($('utr').value||'').trim();if(!/^\d{12}$/.test(u))return toast('Enter the 12-digit UPI transaction (UTR) number');if(S.orders.some(o=>o.pay=='UPI UTR '+u))return toast('This transaction number was already used');
const items=S.cart.map(i=>S.products.find(p=>p.id==i)).filter(p=>p&&p.pub).map(p=>({pid:p.id,name:p.name,price:fin(p)}));
S.orders.push({id:nextId(S.orders),uid:S.me,items,total,coupon:coupon?coupon.code:'',date:new Date().toISOString(),status:'Pending',pay:'UPI UTR '+u});S.cart=[];coupon=null;save();$('mod').innerHTML='';toast('Payment submitted. We’ll verify it and unlock your downloads.');go('orders')}
function grid(){const L=S.products.filter(p=>p.pub&&(!cf||p.cat==cf)&&(p.name+p.desc+p.cat).toLowerCase().includes(q.toLowerCase()));
$('grid').innerHTML=L.length?L.map(p=>`<div class="card"><div class="im">${p.img?`<img src="${p.img}" alt="">`:p.icon||'📄'}${hasVid(p)?'<span class="vtag">▶ Video</span>':''}</div><div class="bd"><div class="cat">${esc(p.cat)}</div><b>${esc(p.name)}</b><div class="pr"><b>${inr(fin(p))}</b>${p.disc?`<s>${inr(p.price)}</s><span>${p.disc}% off</span>`:''}</div><div class="row"><button class="sm" onclick="go('product-${p.id}')">Details</button><button class="p sm" onclick="add(${p.id})">Add to cart</button></div></div></div>`).join(''):'<p>No templates found.</p>'}
function view(id){const p=S.products.find(x=>x.id==id);$('mod').innerHTML=`<div class="modal" onclick="if(event.target==this)this.remove()"><div><div class="card" style="margin-bottom:12px"><div class="im" style="height:180px">${p.img?`<img src="${p.img}" alt="">`:p.icon||'📄'}</div></div><div class="cat">${esc(p.cat)}</div><h2 style="margin:4px 0">${esc(p.name)}</h2><p style="white-space:pre-line">${esc(p.desc)}</p><p class="pr"><b>${inr(fin(p))}</b>${p.disc?`<s>${inr(p.price)}</s><span>${p.disc}% off</span>`:''}</p><div class="row"><button class="p" onclick="add(${p.id});$('mod').innerHTML=''">Add to cart</button><button onclick="$('mod').innerHTML=''">Close</button></div></div></div>`}
function add(id){if(S.cart.includes(id))return toast('Already in your cart');S.cart.push(id);save();toast('Added to cart');const a=$('cartlnk');if(a)a.textContent='🛒 Cart ('+S.cart.length+')';const b=$('addb');if(b){b.textContent='✓ In cart – View cart';b.onclick=()=>go('cart')}}
function cartView(){const L=S.cart.map(i=>S.products.find(p=>p.id==i)).filter(p=>p&&p.pub);if(!L.length)return '<div class="box">Your cart is empty.</div>';
const sub=L.reduce((a,p)=>a+fin(p),0),off=coupon?Math.round(sub*coupon.pct/100):0;
return `<div class="box"><h2 style="margin-top:0">Your cart</h2>${L.map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${esc(p.name)}</span><span>${inr(fin(p))} <button class="sm d" onclick="S.cart=S.cart.filter(x=>x!=${p.id});save();go('cart')">✕</button></span></div>`).join('')}
<div class="tools" style="margin-top:12px"><input id="cc" placeholder="Coupon code" style="flex:0 1 180px"><button onclick="applyC()">Apply</button></div>
<p>Subtotal: ${inr(sub)}${coupon?`<br>Coupon ${esc(coupon.code)} (−${coupon.pct}%): −${inr(off)}`:''}<br><b style="font-size:19px">Total: ${inr(sub-off)}</b></p><button class="p big" onclick="upiPay(${sub-off})">Pay with UPI</button><p class="note">GPay, PhonePe, Paytm, BHIM or any UPI app.</p></div>`}
function applyC(){const c=S.coupons.find(x=>x.code==$('cc').value.trim().toUpperCase());if(!c)return toast('Invalid coupon');coupon=c;go('cart')}
function pay(total){if(!me()){toast('Please log in to continue');return go('login')}
const items=S.cart.map(i=>S.products.find(p=>p.id==i)).filter(p=>p&&p.pub).map(p=>({pid:p.id,name:p.name,price:fin(p)}));
S.orders.push({id:nextId(S.orders),uid:S.me,items,total,coupon:coupon?coupon.code:'',date:new Date().toISOString(),status:'Paid',pay:'rzp_demo_'+Math.random().toString(36).slice(2,10)});
S.cart=[];coupon=null;save();toast('Payment successful! Confirmation email sent (demo).');go('orders')}
function ordersView(){if(!me())return '<div class="box">Please <a class="lnk" onclick="go(\'login\')"><u>log in</u></a> to see your purchases.</div>';
const L=S.orders.filter(o=>o.uid==S.me).reverse();if(!L.length)return '<div class="box">No purchases yet.</div>';
return L.map(o=>`<div class="box"><b>Order #${o.id}</b> <span class="tag">${o.status}</span> <span class="note">${new Date(o.date).toLocaleString()} · ${o.pay}</span>${o.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${esc(i.name)}</span>${o.status=='Paid'?`<button class="p sm" onclick="dl(${i.pid},${o.id})">⬇ Download</button>`:''}</div>`).join('')}<b>Total ${inr(o.total)}</b>${o.status=='Pending'?'<p class="note">Waiting for payment verification. Downloads unlock once confirmed.</p>':''}</div>`).join('')}
function dl(pid,oid){const o=S.orders.find(x=>x.id==oid);if(!o||o.uid!=S.me||o.status!='Paid')return toast('Not allowed');const p=S.products.find(x=>x.id==pid);if(!p)return;
const a=document.createElement('a');if(p.file){a.href=p.file;a.download=p.fileName||p.name+'.xlsx'}else{a.href=URL.createObjectURL(new Blob(['Sample file for '+p.name+'\n(Admin has not uploaded the real Excel file yet.)'],{type:'text/plain'}));a.download=p.name+'.txt'}a.click()}
function login(){const u=S.users.find(x=>x.email==$('le').value.trim().toLowerCase()&&x.pw==$('lp').value);if(!u)return toast('Wrong email or password');S.me=u.id;save();go('shop')}
function reg(){const n=$('rn').value.trim(),e=$('re').value.trim().toLowerCase(),p=$('rp').value;if(!n||!/\S+@\S+\.\S+/.test(e)||p.length<6)return toast('Enter name, valid email, 6+ char password');if(S.users.some(u=>u.email==e))return toast('Email already registered');
const u={id:nextId(S.users),name:n,email:e,pw:p,joined:new Date().toISOString()};S.users.push(u);S.me=u.id;save();toast('Welcome, '+n+'!');go('shop')}

const T=['Dashboard','Homepage','Products','Categories','Orders','Payments','Customers','Coupons','Website settings'];
let b='';const f={Dashboard:aDash,Homepage:aHome,Products:aProd,Categories:aCat,Orders:aOrd,Payments:aPay,Customers:aCust,Coupons:aCoup,'Website settings':aSet}[tab];b=f();

function alog(){if($('ap').value==S.set.pw){adm=true;admin()}else toast('Wrong password')}
function aDash(){const paid=S.orders.filter(o=>o.status=='Paid'),rev=paid.reduce((a,o)=>a+o.total,0),by={};paid.forEach(o=>o.items.forEach(i=>by[i.name]=(by[i.name]||0)+i.price));
return `<div class="stats"><div class="stat"><b>${inr(rev)}</b><span>Total revenue</span></div><div class="stat"><b>${paid.length}</b><span>Paid orders</span></div><div class="stat"><b>${S.users.length}</b><span>Customers</span></div><div class="stat"><b>${S.products.filter(p=>p.pub).length}/${S.products.length}</b><span>Published products</span></div></div>

<button onclick="csv()">⬇ Export orders report (CSV)</button>`}
function csv(){const r=[['Order','Date','Customer','Items','Total','Coupon','Status']].concat(S.orders.map(o=>[o.id,o.date,(S.users.find(u=>u.id==o.uid)||{}).email,o.items.map(i=>i.name).join(' | '),o.total,o.coupon,o.status]));

return `<div class="box"><h3 style="margin-top:0">${edit?'Edit':'Add new'} product</h3><div class="form w">
<label>Name<input id="pn" value="${esc(p.name)}"></label><label>Category<select id="pc">${S.cats.map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>

async function fpReset(){const a=$('np').value,b=$('cp').value;if(a.length<6)return toast('Password must be at least 6 characters');if(a!==b)return toast('Passwords do not match');try{await api('/api/reset-password','POST',{token:fp.token,pw:a});$('mod').innerHTML='';lt='in';toast('Password changed! Please log in with your new password.');authPage()}catch(e){toast(e.message)}}
/* automatic UPI payment (Razorpay) with manual UPI as the fallback */
const loadRzp=()=>window.Razorpay?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load the payment window'));document.body.appendChild(s)});
async function upiPay(total,isBuy){if(!isBuy)buyIds=null;if(!me()){toast('Please log in to continue');return go('login')}if(S.payMode!=='razorpay')return upiManual(total);
try{await loadRzp();const d=await api('/api/pay/create','POST',{ids:payIds(),coupon:payCoupon()});
new Razorpay({key:d.key,amount:d.amount,currency:'INR',name:d.name,description:'Excel templates',order_id:d.rzp,prefill:{name:d.user.name,email:d.user.email},theme:{color:'#107c41'},
handler:async r=>{try{await api('/api/pay/verify','POST',{oid:d.oid,payment_id:r.razorpay_payment_id,order_id:r.razorpay_order_id,signature:r.razorpay_signature});afterPay();toast('Payment successful! Your download is ready and an email is on its way.');go('orders')}catch(e){toast(e.message)}},
modal:{ondismiss:()=>toast('Payment cancelled')}}).open()}catch(e){toast(e.message)}}
async function resendMail(id){try{const d=await api('/api/admin/orders/'+id+'/email','POST',{});toast(d.ok?'Email sent to the customer':'Email failed. Check the email setup in Render.')}catch(e){toast(e.message)}}
async function testMail(){try{const d=await api('/api/admin/test-mail','POST',{});toast(d.ok?'Test email sent to '+d.to:'Email failed. Check BREVO_API_KEY and FROM_EMAIL in Render.')}catch(e){toast(e.message)}}
/* ===== COMING SOON POPUPS, PRODUCT DETAILS + VIDEO, BUY NOW ===== */
const SOON={ai:{e:'🤖',t:'AI Prompts',m:'Something intelligent is cooking! Our AI Prompt Templates are coming soon. Stay tuned!'},prod:{e:'🛍️',t:'New Products',m:'New products are on the way! We’re preparing something worth adding to your cart. Stay tuned!'}};
function soon(k){if(k=='ai')return aiPage();const x=SOON[k];$('mod').innerHTML=`<div class="modal" onclick="if(event.target==this)$('mod').innerHTML=''"><div class="soonc"><div class="se">${x.e}</div><div><span class="chip">COMING SOON</span></div><h3>${x.t}</h3><p>${x.m}</p><button class="p big" onclick="$('mod').innerHTML=''">Got it</button></div></div>`}
const hasVid=p=>!!(p.hasVideo||/^https?:\/\//.test(p.videoUrl||''));
function vidHTML(p){if(p.hasVideo)return `<video controls autoplay playsinline src="/api/video/${p.id}?v=${p.videoV||0}"></video>`;const u=p.videoUrl||'';let m;
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/))return `<iframe src="https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return `<iframe src="https://player.vimeo.com/video/${m[1]}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
if(/^https?:\/\//.test(u))return `<video controls autoplay playsinline src="${esc(u)}"></video>`;return ''}
function playV(id){const p=S.products.find(x=>x.id==id);if(p)$('vbox').innerHTML=vidHTML(p)}
function pFeat(p){const L=String(p.desc||'').split('\n').map(x=>x.trim()).filter(Boolean),own=String(p.features||'').split('\n').map(x=>x.replace(/^[•\-*✓]\s*/,'').trim()).filter(Boolean);
if(own.length)return{d:L.join('\n'),f:own};return{d:L.filter(x=>!x.startsWith('•')).join('\n'),f:L.filter(x=>x.startsWith('•')).map(x=>x.replace(/^•\s*/,''))}}
function productView(id){const p=S.products.find(x=>x.id==id&&x.pub);if(!p)return '<div class="box">This product is not available. <a class="lnk" onclick="go(\'shop\')"><u>Back to the shop</u></a></div>';
const x=pFeat(p),poster=p.img?`<img src="${p.img}" alt="">`:p.icon||'📄',inCart=S.cart.includes(p.id);
const media=hasVid(p)?`<div class="vbox" id="vbox">${poster}<div class="vscrim"></div><button class="playb" onclick="playV(${p.id})" aria-label="Play video">▶</button><div class="playl">Watch the preview</div></div>`:`<div class="vbox">${poster}</div>`;
return `<div class="pp"><a class="back" onclick="go('shop')">← Back to all templates</a>${media}<div class="cat" style="margin-top:14px">${esc(p.cat)}</div><h1 class="ptitle">${esc(p.name)}</h1>
<div class="pr"><b style="font-size:24px">${inr(fin(p))}</b>${p.disc?`<s>${inr(p.price)}</s><span>${p.disc}% off</span>`:''}</div>
<div class="pbuy"><button class="p big" onclick="buyNow(${p.id})">Buy Now</button><button class="big" id="addb" onclick="${inCart?"go('cart')":`add(${p.id})`}">${inCart?'✓ In cart – View cart':'Add to Cart'}</button></div>
<p class="note">Instant download after your payment is confirmed. Buy Now purchases only this template.</p>
${x.d?`<h2 class="sec" style="margin-top:22px">About this template</h2><p style="white-space:pre-line;margin:0">${esc(x.d)}</p>`:''}
${x.f.length?`<h2 class="sec" style="margin-top:22px">Features</h2><ul class="ft">${x.f.map(f=>{const i=f.indexOf(' – ');return `<li><span>${i>0?`<b>${esc(f.slice(0,i))}</b> – ${esc(f.slice(i+3))}`:esc(f)}</span></li>`}).join('')}</ul>`:''}</div>`}
function buyNow(id){const p=S.products.find(x=>x.id==id&&x.pub);if(!p)return;if(!me()){toast('Please log in to continue');return go('login')}buyIds=[p.id];upiPay(fin(p),true)}
async function upVideo(pid,f){const r=await fetch('/api/admin/video/'+pid,{method:'PUT',headers:{'Content-Type':f.type||'video/mp4','X-File-Name':encodeURIComponent(f.name)},body:f,credentials:'same-origin'});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Video upload failed')}

let CK=null,ckT;
const ref=id=>'RIOT-'+String(id).padStart(6,'0'),isMob=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function upiPay(total,isBuy){if(!isBuy)buyIds=null;if(!me()){toast('Please log in to continue');return go('login')}ckConfirm()}
function ckItems(){return payIds().map(i=>S.products.find(p=>p.id==i)).filter(p=>p&&p.pub)}
function ckTotal(L){const sub=L.reduce((a,p)=>a+fin(p),0),c=buyIds?null:coupon,off=c?Math.round(sub*c.pct/100):0;return{sub,off,total:sub-off,c}}
function ckConfirm(){const L=ckItems();if(!L.length)return toast('Your cart is empty');const t=ckTotal(L);
ckOpen(`<div class="ck" onclick="if(event.target==this)ckClose()"><div class="ckc"><div style="font-size:50px">🛒</div><h2 style="margin:8px 0 14px">Confirm your purchase</h2>
<div class="cki" style="margin-bottom:16px">${L.map(p=>`<div class="ckrow"><span>${esc(p.name)}<br><small>${esc(p.cat)}</small></span><b>${inr(fin(p))}</b></div>`).join('')}${t.off?`<div class="ckrow"><span>Coupon ${esc(t.c.code)}</span><b>−${inr(t.off)}</b></div>`:''}<div class="ckrow"><span>Delivery</span><b>Instant digital download</b></div><div class="ckrow" style="border:0"><span>Total payable</span><b style="font-size:20px">${inr(t.total)}</b></div></div>
<p style="margin:0 0 18px">Are you sure you want to purchase this product? Thank you for choosing RIOT!</p>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="ckbtn" id="ckgo" onclick="ckStart()">Confirm Purchase</button><button class="ckbtn g" onclick="ckClose()">Cancel</button></div></div></div>`)}
async function ckStart(){const b=$('ckgo');if(b){b.disabled=true;b.textContent='Preparing secure payment…'}
try{const d=await api('/api/checkout/start','POST',{ids:payIds(),coupon:payCoupon()});CK=Object.assign(d,{failed:false,reason:''});ckPay()}catch(e){ckClose();toast(e.message)}}
const upiQS=d=>`pa=${encodeURIComponent(S.set.upi)}&pn=${encodeURIComponent(S.set.upiName||S.set.name)}&am=${d.total}.00&cu=INR&tn=${encodeURIComponent(d.ref)}&tr=${encodeURIComponent(d.ref)}`;
function ckPay(){const d=CK,gw=d.mode=='gateway',B=esc(S.set.name);
const tile=(k,l,c,ic,w)=>`<button class="ckopt ${w?'w':''}" onclick="ckChoose('${k}')"><i style="background:${c}">${ic}</i><span>${l}</span></button>`;
const manual=gw?'':`<div class="cki" id="ckqrbox" style="text-align:center;transition:.3s"><b style="color:#fff">Scan QR Code</b><div style="color:#9db3a8;font-size:13px;margin:4px 0 12px">Scan with GPay, PhonePe, Paytm or any UPI app</div><div class="ckqr">${S.set.qr?`<img src="${S.set.qr}" alt="Merchant QR code">`:'<div id="ckqr"></div>'}</div><div style="color:#9db3a8;font-size:13px;margin-top:10px">Pay exactly <b style="color:#fff">${inr(d.total)}</b> · add remark <b style="color:#fff">${d.ref}</b></div></div>
<div class="cki" id="ckpaid"><b style="color:#fff">Already paid?</b><div style="color:#9db3a8;font-size:13px">Enter the 12-digit UTR / transaction number from your UPI app. Your order stays <b style="color:#ffd37a">Pending</b> until our team verifies the payment, then the download unlocks.</div><input id="utr" class="ckin" inputmode="numeric" maxlength="12" placeholder="e.g. 412345678901"><button class="ckbtn" onclick="ckUtr()">Submit for verification</button></div>`;

<div class="ckL"><div class="ckbrand">${logo(34)} ${B}</div><div><div style="color:#9db3a8;font-size:13px">Total payable</div><div class="ckamt">${inr(d.total)}</div></div>
<div class="cki">${d.items.map(i=>`<div class="ckrow"><span>${esc(i.name)}</span><b>${inr(i.price)}</b></div>`).join('')}<div class="ckrow"><span>Order ID</span><b>${d.ref}</b></div><div class="ckrow"><span>Merchant</span><b>${esc(S.set.upiName||S.set.name)}</b></div>${!gw&&S.set.upi?`<div class="ckrow"><span>UPI ID</span><b>${esc(S.set.upi)}</b></div>`:''}${S.set.email?`<div class="ckrow" style="border:0"><span>Support</span><b>${esc(S.set.email)}</b></div>`:''}</div>

${gw?`<div class="cki" style="color:#b9cbc1;font-size:13.5px">✅ Payments are verified automatically with the bank. Your download unlocks the moment the payment is confirmed. ${isMob()?'':'<br><br>On a computer? Choose <b style="color:#fff">Scan QR Code</b> to get a payment QR for this order.'}</div>`:manual}</div></div></div>`);

function upiLaunch(k){const A=/Android/i.test(navigator.userAgent),I=/iPhone|iPad|iPod/i.test(navigator.userAgent);
if(!A&&!I){toast('On a computer? Scan the QR code with your phone’s UPI app.');const e=$('ckqrbox');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});return}
const qs=upiQS(CK),pk={gpay:'com.google.android.apps.nbu.paisa.user',phonepe:'com.phonepe.app',paytm:'net.one97.paytm'}[k],sc={gpay:'tez://upi/pay?',phonepe:'phonepe://pay?',paytm:'paytmmp://pay?'}[k];

const ckBusy=(t,m)=>`<div class="ck"><div class="ckc"><div class="ckspin"></div><h2 style="margin-top:10px">${t}</h2><p id="ckvm">${m}</p><div style="color:#9db3a8;font-size:13px">Order ${CK.ref}</div></div></div>`;
async function ckVerify(r){CK.failed=false;CK.verifying=true;ckOpen(ckBusy('Verifying your payment','Confirming with the payment gateway. Please don’t close this window…'));
try{const v=await api('/api/pay/verify','POST',{oid:CK.oid,payment_id:r.razorpay_payment_id,order_id:r.razorpay_order_id,signature:r.razorpay_signature});
if(v.status=='Successful')return ckDone(v);if(v.status=='Failed')return ckFail(v.reason);ckPoll(0,true)}catch(e){ckPending(e.message)}}
async function ckPoll(n,shown){clearTimeout(ckT);if(n>=40)return ckPending('Your bank is taking longer than usual to confirm.');
if(!shown)ckOpen(ckBusy('Payment pending','Waiting for your bank to confirm the payment…'));
try{const s=await api('/api/pay/status/'+CK.oid);if(s.status=='Successful')return ckDone(s);if(s.status=='Failed')return ckFail(s.reason)}catch(e){}
const m=$('ckvm');if(m)m.textContent='Waiting for your bank to confirm the payment… (check '+(n+1)+')';ckT=setTimeout(()=>ckPoll(n+1,true),3500)}
function ckPending(msg){ckOpen(`<div class="ck"><div class="ckc"><div style="font-size:54px">⏳</div><h2 style="margin:8px 0">Payment pending</h2><p>${esc(msg||'')} You can close this window. Your order <b style="color:#fff">${CK.ref}</b> will unlock automatically and we’ll email you as soon as the payment is confirmed.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="ckbtn" onclick="ckPoll(0)">Check again</button><button class="ckbtn g" onclick="ckClose();go('orders')">My Orders</button></div></div></div>`)}
function ckFail(reason){CK.verifying=false;ckOpen(`<div class="ck"><div class="ckc"><div style="font-size:54px">❌</div><h2 style="margin:8px 0">Payment failed</h2><p>${esc(reason||'The payment could not be completed.')} No money is lost: if your account was debited, it is refunded by your bank automatically.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="ckbtn" onclick="ckPay()">Try again</button><button class="ckbtn g" onclick="ckClose()">Close</button></div></div></div>`)}
async function ckDone(s){let f=s;try{if(!f||!f.txn)f=await api('/api/pay/status/'+CK.oid)}catch(e){}f=f||{oid:CK.oid,ref:CK.ref,total:CK.total,items:CK.items};afterPay();ckSuccess(f)}
function ckSuccess(s){const its=s.items||[],dls=its.map(i=>`<button class="ckbtn" onclick="dl(${i.pid},${s.oid})">⬇ Download Now${its.length>1?' – '+esc(i.name):''}</button>`).join('');
const cf=Array.from({length:24},(_,i)=>`<span class="cf" style="left:${Math.random()*100}%;background:${['#2ecc71','#f5a623','#4285f4','#ff6b9d','#fff'][i%5]};animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(3.5+Math.random()*3).toFixed(2)}s"></span>`).join('');
ckOpen(`<div class="ckf">${cf}<div class="ckfc"><div class="ckchk"><svg viewBox="0 0 52 52" fill="none"><path d="M14 27l8 8 16-17" stroke="#04140c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1 style="font-size:clamp(24px,5vw,34px)">Payment successful</h1><p style="margin:0;color:#d4ece0;font-size:17px">Thank you for purchasing from RIOT! Your payment has been received successfully.</p>
<div class="ckcard"><div class="ckrow"><span>Transaction ID</span><b>${esc(s.txn||'—')}</b></div><div class="ckrow"><span>Order ID</span><b>${esc(s.ref||ref(s.oid))}</b></div><div class="ckrow" style="border:0"><span>Amount paid</span><b>${inr(s.total)}</b></div></div>
<div style="display:flex;flex-direction:column;gap:10px;width:100%">${dls}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="ckbtn g" onclick="rcpt(${s.oid})">🧾 View receipt</button><button class="ckbtn g" onclick="ckClose();go('orders')">My Orders</button></div>
<p style="color:#9db3a8;font-size:13px;margin:0">A confirmation email with your download link and receipt is on its way.</p></div></div>`)}
async function ckUtr(){const u=($('utr').value||'').trim();if(!/^\d{12}$/.test(u))return toast('Enter the 12-digit UPI transaction (UTR) number');
try{await api('/api/checkout/utr','POST',{oid:CK.oid,utr:u});afterPay();ckOpen(`<div class="ck"><div class="ckc"><div style="font-size:54px">⏳</div><h2 style="margin:8px 0">Submitted – pending verification</h2><p>Thank you! Order <b style="color:#fff">${CK.ref}</b> is <b style="color:#ffd37a">Pending</b>. Our team will verify your payment and your download will unlock after that. We’ll email you the moment it’s confirmed.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="ckbtn" onclick="ckClose();go('orders')">My Orders</button><button class="ckbtn g" onclick="ckClose()">Close</button></div></div></div>`)}catch(e){toast(e.message)}}
const rcpt=oid=>window.open('/api/receipt/'+oid,'_blank');
function placeOrder(){}
function buyNow(id){const p=S.products.find(x=>x.id==id&&x.pub);if(!p)return;if(!me()){toast('Please log in to continue');return go('login')}buyIds=[p.id];upiPay(fin(p),true)}

/* ===== MY ORDERS ===== */
function ordersView(){if(!me())return '<div class="box">Please <a class="lnk" onclick="go(\'login\')"><u>log in</u></a> to see your purchases.</div>';const L=S.myOrders||[];if(!L.length)return '<div class="box">No purchases yet.</div>';
return L.map(o=>{const ok=o.status=='Successful'&&!o.revoked;return `<div class="box"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>${ref(o.id)}</b><span class="tag s${o.status}">${o.status}</span></div><div class="note">${new Date(o.date).toLocaleString()}${o.method?' · '+esc(o.method):''}${o.txn?' · Transaction '+esc(o.txn):''}</div>
${o.items.map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;gap:8px"><span>${esc(i.name)}</span>${ok?`<button class="p sm" onclick="dl(${i.pid},${o.id})">⬇ Download Now</button>`:''}</div>`).join('')}
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><b>Total ${inr(o.total)}</b>${o.status=='Successful'||o.status=='Refunded'?`<button class="sm" onclick="rcpt(${o.id})">🧾 Receipt</button>`:''}</div>
${o.status=='Pending'?'<p class="note">Waiting for payment verification. Your download unlocks automatically once the payment is confirmed.</p>':''}${o.status=='Failed'?`<p class="note" style="color:var(--dn)">${esc(o.fail_reason||'The payment failed.')} You can buy again from the product page.</p>`:''}${o.status=='Refunded'?'<p class="note">This payment was refunded.</p>':''}${o.status=='Successful'&&o.revoked?'<p class="note" style="color:var(--dn)">Download access is currently disabled. Please contact support.</p>':''}</div>`}).join('')}

/* ===== ADMIN: orders, payments, refunds, access, dashboard ===== */
let ofl='';
const SB=['Pending','Successful','Failed','Refunded'];
async function setSt(id,v){try{await api('/api/admin/orders/'+id,'PATCH',{status:v});toast('Order updated'+(v=='Successful'?'. Customer emailed.':''));refresh()}catch(e){toast(e.message)}}
async function refundOrd(id){const o=S.orders.find(x=>x.id==id);const a=prompt('Refund amount in ₹ for '+ref(id)+' (full amount is '+o.total+'):',o.total);if(a===null)return;if(!confirm('Refund ₹'+a+' for '+ref(id)+'? This blocks the customer’s download.'))return;try{const d=await api('/api/admin/orders/'+id+'/refund','POST',{amount:+a});toast(d.refund=='manual'?'Refund recorded (send the money from your UPI app)':'Refund sent through the gateway');refresh()}catch(e){toast(e.message)}}
async function accessOrd(id,rv){try{await api('/api/admin/orders/'+id+'/access','POST',{revoked:rv});toast(rv?'Download access revoked':'Download access restored');refresh()}catch(e){toast(e.message)}}
function aOrd(){const L=S.orders.slice().reverse().filter(o=>!ofl||o.status==ofl);
return `<div class="tools"><select onchange="ofl=this.value;admin()"><option value="">All statuses</option>${SB.map(x=>`<option ${x==ofl?'selected':''}>${x}</option>`).join('')}</select><span class="note" style="align-self:center">${L.length} order(s)</span></div>
<div class="box tbl"><table style="min-width:900px"><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Payment</th><th>Status</th><th>Actions</th></tr>${L.map(o=>`<tr><td><b>${ref(o.id)}</b></td><td>${new Date(o.date).toLocaleDateString()}</td><td>${esc((S.users.find(u=>u.id==o.uid)||{}).email)}</td><td>${o.items.map(i=>esc(i.name)).join(', ')}</td>
<td>${inr(o.total)}<br><span class="note">${esc(o.method||'')}${o.txn||o.pay?'<br>'+esc(o.txn||o.pay):''}</span>${o.status=='Failed'&&o.fail_reason?`<br><span class="note" style="color:var(--dn)">${esc(o.fail_reason)}</span>`:''}${o.refund_id?`<br><span class="note">Refund ${inr(o.refund_amt||0)} · ${esc(o.refund_id)}</span>`:''}</td>
<td><select onchange="setSt(${o.id},this.value)">${SB.map(x=>`<option ${o.status==x?'selected':''}>${x}</option>`).join('')}</select></td>
<td style="white-space:nowrap">${o.status=='Successful'?`<button class="sm" onclick="resendMail(${o.id})">Email</button> <button class="sm" onclick="rcpt(${o.id})">Receipt</button> <button class="sm d" onclick="refundOrd(${o.id})">Refund</button><br><button class="sm" style="margin-top:4px" onclick="accessOrd(${o.id},${!o.revoked})">${o.revoked?'Restore access':'Revoke access'}</button> <span class="note">⬇ ${o.dl_count||0}</span>`:o.status=='Refunded'?`<button class="sm" onclick="rcpt(${o.id})">Receipt</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>No orders yet.</td></tr>'}</table></div>`}
async function refresh(){try{const d=await api('/api/admin/state');S.orders=d.orders;S.users=d.users;if(tab=='Payments'){S.payst=await api('/api/admin/pay-status');S.events=(await api('/api/admin/events')).events}}catch(e){}admin()}
async function qrUp(i){const f=i.files[0];if(!f)return;if(f.size>600*1024)return toast('QR image is too large (max 600 KB)');S.set.qr=await rd(f);save();toast('QR code saved');admin()}
function aPay(){const g=S.payst||{},s=S.set,wh=location.origin+'/api/pay/webhook',ok=(b,t)=>`<span class="tag ${b?'':'g'}">${b?'✓':'✗'} ${t}</span>`,rf=S.orders.filter(o=>o.refund_id);
return `<div class="box"><h3 style="margin-top:0">Payment gateway (Razorpay)</h3><p>${ok(g.gateway,'API keys '+(g.gateway?'connected · '+(g.mode||'').toUpperCase()+' mode':'not set'))} ${ok(g.webhook,'Webhook secret '+(g.webhook?'set':'not set'))} ${ok(g.mail,'Email service')}</p>
${g.gateway?'<p>✅ Customers pay through the gateway. Payments are verified on the server and orders unlock automatically. Nothing to mark by hand.</p>':'<p>⚠️ Gateway not connected. The store is using <b>manual UPI</b>: orders stay <b>Pending</b> until you check your bank/UPI app and mark them <b>Successful</b> in Orders.</p>'}
<p class="note">For safety, secret keys are never stored in this panel. Add them in Render → Environment: <b>RAZORPAY_KEY_ID</b>, <b>RAZORPAY_KEY_SECRET</b>, <b>RAZORPAY_WEBHOOK_SECRET</b>, then deploy.</p>
<label>Webhook URL (Razorpay → Settings → Webhooks → Add)<input readonly value="${esc(wh)}" onclick="this.select()"></label><p class="note">Active events to tick: payment.captured, payment.failed, order.paid, refund.processed. Use the same secret you put in RAZORPAY_WEBHOOK_SECRET.</p></div>
<div class="box"><h3 style="margin-top:0">UPI payment settings &amp; QR code</h3><div class="form w"><label>UPI ID<input id="p_upi" value="${esc(s.upi)}"></label><label>Payee / merchant name<input id="p_upin" value="${esc(s.upiName)}"></label><label>Merchant QR code image ${s.qr?'<span class="tag">uploaded</span>':'(optional)'}<input type="file" accept="image/*" onchange="qrUp(this)"></label></div>
${s.qr?`<div style="display:flex;gap:14px;align-items:center;margin:12px 0"><img src="${s.qr}" alt="" style="width:120px;height:120px;object-fit:contain;background:#fff;border-radius:10px;padding:6px"><button class="sm d" onclick="S.set.qr='';save();admin()">Remove QR</button></div>`:''}
<button class="p" onclick="S.set.upi=$('p_upi').value.trim();S.set.upiName=$('p_upin').value.trim();save();toast('UPI settings saved')">Save UPI settings</button>
<p class="note">With the gateway connected, customers get a dynamic, order-specific QR from the gateway. The UPI ID and uploaded QR are used only in manual mode, where every order stays Pending until you verify it.</p></div>
<div class="box"><h3 style="margin-top:0">Refund tracking</h3><div class="tbl"><table><tr><th>Order</th><th>Refund</th><th>Reference</th><th>Date</th></tr>${rf.map(o=>`<tr><td>${ref(o.id)}</td><td>${inr(o.refund_amt||0)} of ${inr(o.total)}</td><td>${esc(o.refund_id)}</td><td>${o.refunded_at?new Date(o.refunded_at).toLocaleString():''}</td></tr>`).join('')||'<tr><td colspan=4>No refunds yet.</td></tr>'}</table></div></div>
<div class="box"><h3 style="margin-top:0">Transaction history</h3><div class="tbl"><table><tr><th>Time</th><th>Order</th><th>Event</th><th>Details</th></tr>${(S.events||[]).map(e=>`<tr><td>${new Date(e.at).toLocaleString()}</td><td>${e.oid?ref(e.oid):''}</td><td>${esc(e.kind)}</td><td>${esc(e.note)}</td></tr>`).join('')||'<tr><td colspan=4>No payment events yet.</td></tr>'}</table></div></div>`}
function aDash(){const ok=S.orders.filter(o=>o.status=='Successful'),rev=ok.reduce((a,o)=>a+o.total,0),by={},n=x=>S.orders.filter(o=>o.status==x).length,rf=S.orders.filter(o=>o.refund_id).reduce((a,o)=>a+(o.refund_amt||0),0);ok.forEach(o=>o.items.forEach(i=>by[i.name]=(by[i.name]||0)+i.price));
return `<div class="stats"><div class="stat"><b>${inr(rev)}</b><span>Total revenue</span></div><div class="stat"><b>${ok.length}</b><span>Successful orders</span></div><div class="stat"><b>${n('Pending')}</b><span>Pending</span></div><div class="stat"><b>${n('Failed')}</b><span>Failed</span></div><div class="stat"><b>${inr(rf)}</b><span>Refunded</span></div><div class="stat"><b>${S.users.length}</b><span>Customers</span></div><div class="stat"><b>${S.products.filter(p=>p.pub).length}/${S.products.length}</b><span>Published products</span></div></div>
<div class="box"><b>Sales by product</b><div class="tbl"><table><tr><th>Product</th><th>Revenue</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${inr(v)}</td></tr>`).join('')||'<tr><td colspan=2>No sales yet.</td></tr>'}</table></div></div>
<button onclick="csv()">⬇ Export orders report (CSV)</button>`}
function aCust(){return `<div class="box tbl"><table><tr><th>Name</th><th>Email</th><th>Joined</th><th>Orders</th><th>Spent</th></tr>${S.users.map(u=>{const o=S.orders.filter(x=>x.uid==u.id&&x.status=='Successful');return `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${new Date(u.joined).toLocaleDateString()}</td><td>${o.length}</td><td>${inr(o.reduce((a,x)=>a+x.total,0))}</td></tr>`}).join('')||'<tr><td colspan=5>No customers yet.</td></tr>'}</table></div>`}
function csv(){const r=[['Order ID','Date','Customer','Items','Total','Coupon','Status','Method','Transaction','Refund']].concat(S.orders.map(o=>[ref(o.id),o.date,(S.users.find(u=>u.id==o.uid)||{}).email,o.items.map(i=>i.name).join(' | '),o.total,o.coupon,o.status,o.method||'',o.txn||o.pay||'',o.refund_amt||'']));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='orders.csv';a.click()}

boot();
</script></body></html>
